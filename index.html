<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CPU Scheduling Simulator</h1>
        
        <div id="inputSection">
            <label>Enter Processes:</label>
            <div id="processInputContainer">
                <div class="process-input">
                    <input type="text" class="processId" id="zxc" placeholder="Process ID" />
                    <input type="number" class="arrivalTime" id="zxc" placeholder="Arrival Time" />
                    <input type="number" class="burstTime" id="zxc" placeholder="Burst Time" />
                </div>
            </div>
            <button id="addProcessBtn">Add Process</button>
            <button onclick="startSimulation()">Start Simulation</button>
            
            <label for="algorithm">Choose Algorithm:</label>
            <select id="algorithm">
                <option value="fcfs">First-Come-First-Served (FCFS)</option>
                <option value="sjf">Shortest Job First (SJF)</option>
                <option value="rr">Round Robin (RR)</option>
            </select>

            <div id="timeQuantumInput" style="display:none;">
                <label>Time Quantum (For Round Robin): </label>
                <input type="number" id="timeQuantum" value="4">
            </div>
        </div>
        
        <div id="ganttChartSection" style="overflow: auto; width: 100%; height: 250px;">
            <h2>Gantt Chart</h2>
            <canvas id="ganttChart" width="1600" height="200"></canvas>
        </div>
        
        <div id="outputSection">
            <h2>Simulation Output</h2>
            <p id="simulationResult"></p>
        </div>
        <div id="resultSection">
            <h2>Detailed Result</h2>
            <pre id="detailedResult"></pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
